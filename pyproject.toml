[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dpeva"
dynamic = ["version"]
description = "Deep Potential EVolution Accelerator (DP-EVA)"
readme = "README.md"
authors = [
    { name = "James Misaka", email = "ff6757442@gmail.com" }
]
license = { file = "LICENCE" }
classifiers = [
    "Natural Language :: English",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3 :: Only",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: GNU Lesser General Public License v3 (LGPLv3)",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Physics",
    "Topic :: Scientific/Engineering :: Chemistry",
    "Environment :: Console",
]
dependencies = [
    "numpy>=1.20.0",
    "scipy>=1.7.0",
    "scikit-learn>=1.0.0",
    "dpdata>=1.1",
    "deepmd-kit>=3.1.2,<3.3",
    "matplotlib>=3.5.0",
    "seaborn>=0.11.0",
    "pydantic>=2.0.0",
    "ase>=3.28.0",
    "h5py>=3.0.0",
]
requires-python = ">=3.10"

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "black>=22.0",
    "ruff>=0.15,<0.17",
    "mypy>=1.0",
    "tomli>=1.1.0; python_version < '3.11'",
]
deepmd = [
    "deepmd-kit>=3.2,<3.3",
]
docs = [
    "sphinx>=5.0",
    "sphinx-book-theme",
    "myst-parser",
    "autodoc-pydantic",
    "sphinxcontrib-mermaid",
]
explore = [
    "atst-tools>=2.1.0",
]
dpose = [
    "torch",
]

[project.urls]
Homepage = "https://github.com/QuantumMisaka/dpeva"
Paper = "https://doi.org/10.1093/ce/zkag029"

[project.scripts]
dpeva = "dpeva.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
dpeva = ["compatibility/*.json"]

[tool.ruff]
target-version = "py310"

[tool.ruff.lint]
# The lint gate declares its rule set explicitly so that a new ruff release
# cannot silently expand `python scripts/run_gate.py lint` into a repository-wide
# rewrite. The current selection is the historical ruff default set, which the
# whole repository passes; widening it is a deliberate, reviewable change.
select = ["E4", "E7", "E9", "F"]

[tool.setuptools.dynamic]
version = {attr = "dpeva.__version__"}

[tool.pytest.ini_options]
markers = [
    "deepmd_contract: real DeepMD 3.2 CPU CLI/API contract",
]
