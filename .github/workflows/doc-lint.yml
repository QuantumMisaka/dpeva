name: Documentation Governance

on:
  schedule:
    - cron: "0 2 * * 1"
  push:
    branches: ["main", "develop"]
    paths:
      - "docs/**"
      - "README.md"
      - "scripts/doc_check.py"
      - "scripts/check_docs_freshness.py"
      - "scripts/run_gate.py"
      - "scripts/gates.toml"
      - ".github/workflows/doc-lint.yml"
      - ".github/CODEOWNERS"
  pull_request:
    branches: ["main", "develop"]
    paths:
      - "docs/**"
      - "README.md"
      - "scripts/doc_check.py"
      - "scripts/check_docs_freshness.py"
      - "scripts/run_gate.py"
      - "scripts/gates.toml"
      - ".github/workflows/doc-lint.yml"
      - ".github/CODEOWNERS"

permissions:
  contents: read

concurrency:
  group: doc-lint-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  doc-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml tomli

      - name: Run declared governance gate
        run: python scripts/run_gate.py docs_audit

      - name: Run declared freshness gate
        run: python scripts/run_gate.py docs_freshness
