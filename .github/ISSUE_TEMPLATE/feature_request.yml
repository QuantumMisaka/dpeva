name: Feature request / 功能建议
description: Discuss a concrete use case or workflow improvement.
title: "[Feature]: "
body:
  - type: textarea
    id: use_case
    attributes:
      label: Use case / 使用场景
      description: What are you trying to accomplish, and where does the current workflow fall short?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior / 期望行为
      description: Describe the user-facing behavior and how you would know it works.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives and scope / 替代方案与边界
      description: Mention existing workarounds, related issues, or compatibility constraints.
